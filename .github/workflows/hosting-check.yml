name: Dashboard hosting package
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'tests/imported-media-url.test.mjs'
      - '.github/workflows/hosting-check.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run test:hosting
      - run: npm run build:hosting && npm run cloudflare:check
        env:
          VITE_SHOP_ID: ci-package-check
          WRANGLER_SEND_METRICS: 'false'
